apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blockchainforge-ingress
  namespace: blockchainforge
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - blockchainforge.yourdomain.com
    secretName: blockchainforge-tls
  rules:
  - host: blockchainforge.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: blockchainforge
            port:
              number: 80
