apiVersion: apps/v1
kind: Deployment
metadata:
  name: blockchainforge
  namespace: blockchainforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blockchainforge
  template:
    metadata:
      labels:
        app: blockchainforge
    spec:
      containers:
      - name: blockchainforge
        image: blockchainforge:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: blockchainforge
spec:
  selector:
    app: blockchainforge
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP 
